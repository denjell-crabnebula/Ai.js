[workspace]
resolver = "2"
members = [
    "rust/ap-support",
    "rust/ap-jsonrpc",
    "AgentRegistry/rust-sdk/a2x-common",
    "MCP/rust-sdk",
    "A2A/rust-sdk",
    "A4P/rust-sdk",
    "AgentRegistry/rust-sdk/a2x-registry",
    "AgentRegistry/rust-sdk/a2x-cluster",
    "AgentRegistry/rust-sdk/a2x-search",
    "AgentRegistry/rust-sdk/a2x-registry-client",
    "rust/agent-protocol-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/denjell-crabnebula/Ai.js"

[workspace.dependencies]
# async runtime + utilities
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
async-stream = "0.3"
pin-project-lite = "0.2"
bytes = "1"

# http
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "gzip"] }
url = "2"
urlencoding = "2"
mime = "0.3"

# serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
ciborium = "0.2"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# crypto
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"

# misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
regex = "1"
globset = "0.4"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
num_cpus = "1"
humantime = "2"
semver = "1"
fs2 = "0.4"

# internal crates
ap-support = { path = "rust/ap-support" }
ap-jsonrpc = { path = "rust/ap-jsonrpc" }
a2x-common = { path = "AgentRegistry/rust-sdk/a2x-common" }
mcp-sdk = { path = "MCP/rust-sdk" }
a2a-sdk = { path = "A2A/rust-sdk" }
a4p = { path = "A4P/rust-sdk", default-features = false }
a2x-registry = { path = "AgentRegistry/rust-sdk/a2x-registry" }
a2x-cluster = { path = "AgentRegistry/rust-sdk/a2x-cluster" }
a2x-search = { path = "AgentRegistry/rust-sdk/a2x-search" }
a2x-registry-client = { path = "AgentRegistry/rust-sdk/a2x-registry-client" }
agent-protocol-wasm = { path = "rust/agent-protocol-wasm" }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
